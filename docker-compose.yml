services:
  app:
    build: .
    ports:
      - '3002:3002'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    container_name: nyx-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - NYX_INTERNAL_HA_URL=${NYX_INTERNAL_HA_URL:-}
      - NYX_INTERNAL_HA_FALLBACK_URL=${NYX_INTERNAL_HA_FALLBACK_URL:-}
      - NYX_ENCRYPTION_MODE=${NYX_ENCRYPTION_MODE:-off}
      - NYX_DATA_KEY=${NYX_DATA_KEY:-}
      - NYX_DATA_KEY_SALT=${NYX_DATA_KEY_SALT:-}
    volumes:
      - nyx-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3002/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  nyx-data:
